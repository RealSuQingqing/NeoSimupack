name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (Java 21)
    runs-on: ubuntu-latest

    env:
      # gradle.properties redirects the Gradle user home into the project
      # directory (systemProp.gradle.user.home=./.gradle_repo) so that the
      # workspace stays self-contained. Point the environment variable at the
      # same location so that gradle/actions/setup-gradle caches it across runs.
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle_repo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # The New: Sim-U-Kraft jar is not present in a fresh clone and is not
      # needed here: the mod only ever reaches NSUK through reflection, so the
      # compile and the unit tests run without it.
      - name: Build
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: simupack-jar
          path: build/libs/*.jar
          if-no-files-found: warn
